<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Pratica aula 02: Formulário</title>
        <link rel="stylesheet" href="formulario.css">
    </head>
    <body>
        <header>
            <h1>Formulário de Cadastro HTML</h1>
            <p>Preencha os campos abaixo para cadastrar:</p>
            <nav aria-label="Navegação Principal">
                <a href="#dados_pessoais">Dados Pessoais</a> |
            </nav>
        </header>
        <main>
            <form action="/inscricao" method="get">
                <fieldset id="dados_pessoais">
                    <legend>Dados Pessoais</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" autocomplete="on" minlength="2" maxlength="100" name="nome" required><br><br>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" autocomplete="on" placeholder="nome@exemplo.com" required><br><br>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" autocomplete="on" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" name="telefone" required><br><br>
                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required><br><br>
                    <label for="sexo">Sexo:</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Selecione</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="nao_informar">Prefiro não informar</option>
                        <option value="outro">Outro</option>
                    </select><br><br>
                    
                </fieldset>
                <p>
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </p>
            </form>
        </main>
    </body>
</html>
